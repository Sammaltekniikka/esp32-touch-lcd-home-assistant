# ==================================================
# LVGL
# Näytön käyttöliittymä
# ==================================================


lvgl: 

  color_depth: 16 

  pages: 
    - id: thermostat_page 
      widgets: 

        - label:
            id: wifi_label
            text: "\U000F05A9"
            text_font: mdi24
            text_color: 0x2196F3
            x: 10
            y: 10

        - label: 
            id: clock_label 
            text: "--:--" 
            text_font:  clock_font
            x: 250 
            y: 10 

        - arc: 
            id: temp_arc 

            width: 260 
            height: 260 
            arc_width: 18 #säätöpyörän paksuuss

            align: CENTER 
            y: -30

            min_value: 15 
            max_value: 25 

            value: 20 

            adjustable: true 
            indicator:
              arc_width: 18
              
            on_change:
              then:
                - lvgl.label.update:
                    id: target_label
                    text:
                      format: "%.1f°C"
                      args: [ x ]

                - homeassistant.action:
                    action: climate.set_temperature
                    data:
                      entity_id: climate.paamakuuhuone_termostaatti
                    data_template:
                      temperature: "{{ target_temp }}"
                    variables:
                        target_temp: |-
                          return x;

        - label:
            id: target_label
            text: "20.0°C"
            text_font: font60
            align: CENTER
            y: -45

        - label: 
            id: room_label 
            text: "Huone --.-°C" 
            text_font: font32
            align: CENTER 
            y: 115 

        - label: 
            id: outdoor_label 
            text: "Ulkona --.-°C" 
            text_font: font20
            align: CENTER 
            y: 150 

        - label:
            id: status_icon
            text: "\U000F0150"
            text_font: mdi24
            align: bottom_mid
            x: -55
            y: -20

        - label:
            id: status_text
            text: "Odottaa"
            text_font: font20
            align: bottom_mid
            x: 10
            y: -20
 
